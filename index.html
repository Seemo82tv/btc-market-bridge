<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC Market Monitor</title>
<style>
body {
  background: #101318;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}
.card {
  background: #202631;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 15px;
}
.price {
  font-size: 32px;
  font-weight: bold;
  color: #00d395;
}
button {
  padding: 12px;
  border: 0;
  border-radius: 8px;
  background: #00d395;
  font-weight: bold;
}
</style>
</head>
<body>
<h2>₿ Bitcoin Market Monitor</h2>

<div class="card">
  <div>Coinbase BTC/USD</div>
  <p class="price" id="price">Loading...</p>
  <div id="updated">Connecting to Coinbase...</div>
</div>

<div class="card">
  <div>Best bid</div>
  <p id="bid">—</p>
  <div>Best ask</div>
  <p id="ask">—</p>
  <div>24-hour volume (BTC)</div>
  <p id="volume">—</p>
</div>

<button onclick="loadPrice()">Refresh price</button>

<script>
async function loadPrice() {
  const status = document.getElementById("updated");

  try {
    status.textContent = "Updating...";

    const response = await fetch(
      "https://api.exchange.coinbase.com/products/BTC-USD/ticker"
    );

    if (!response.ok) {
      throw new Error("Coinbase returned HTTP " + response.status);
    }

    const data = await response.json();

    document.getElementById("price").textContent =
      "$" + Number(data.price).toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

    document.getElementById("bid").textContent = "$" + data.bid;
    document.getElementById("ask").textContent = "$" + data.ask;
    document.getElementById("volume").textContent =
      Number(data.volume).toLocaleString("en-US");

    status.textContent =
      "Updated: " + new Date().toLocaleTimeString();

  } catch (error) {
    status.textContent = "Could not retrieve data: " + error.message;
  }
}

loadPrice();
setInterval(loadPrice, 15000);
</script>
</body>
</html>
